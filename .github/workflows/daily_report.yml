name: 每日报告生成

on:
  schedule:
    - cron: '0 0 * * *'    # 每天 UTC 0 点
  workflow_dispatch:       # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync

      - name: 恢复 SQLite 缓存
        uses: actions/cache@v5
        id: cache-db
        with:
          path: data.db
          key: db-cache-${{ github.ref_name }}
          restore-keys: |
            db-cache-${{ github.ref_name }}

      - name: 检查数据库文件（验证缓存是否命中）
        run: |
          if [ -f "data.db" ]; then
            echo "✅ 成功从缓存恢复数据库，大小："
            ls -lh data.db
          else
            echo "ℹ️ 首次运行或缓存未命中，将新建数据库"
          fi

      - name: 运行主程序
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          DB_PATH: data.db
        run: uv run python main.py

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: 蕾忍2数据分析报告
          path: report.html
